<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     lang="zh-CN" font-family="'PingFang SC', 'Microsoft YaHei', 'Heiti SC', Impact, sans-serif"
     data-pptx-page-role="ending">
  
  <defs>
    <!-- Riso Halftone Grid -->
    <pattern id="halftone-pink" width="12" height="12" patternUnits="userSpaceOnUse" data-pptx-pattern="dotGrid" data-pptx-fg="#FF4765" data-pptx-bg="#FAF6EE">
      <circle cx="6" cy="6" r="2.2" fill="#FF4765" fill-opacity="0.3"/>
    </pattern>
    <pattern id="halftone-teal" width="12" height="12" patternUnits="userSpaceOnUse" data-pptx-pattern="dotGrid" data-pptx-fg="#006B7B" data-pptx-bg="#FAF6EE">
      <circle cx="6" cy="6" r="2.2" fill="#006B7B" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Paper -->
  <rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FAF6EE"/>

  <!-- Top DIY Tape Banner Zone -->
  <g id="top-tape-zone" data-pptx-bounds="40 18 1200 55">
    <rect x="64" y="24" width="1156" height="42" fill="#FF4765"/>
    <rect x="60" y="20" width="1156" height="42" fill="#181A24"/>
    <text x="638" y="47" fill="#FFA800" font-size="14" font-weight="900" letter-spacing="2" text-anchor="middle" font-family="'Courier New', monospace">
      ★ REPO ARCHIVE CLOSING · EMPOWER YOUR LEARNING JOURNEY · ONE WORD AT A TIME ★
    </text>
  </g>

  <!-- Big Central Poster Canvas Zone -->
  <g id="center-poster-zone" data-pptx-bounds="100 90 1080 455">
    <!-- Double Offset Riso Frames -->
    <rect x="144" y="104" width="996" height="430" fill="#FF4765"/>
    <rect x="140" y="100" width="996" height="430" fill="#006B7B" stroke="#181A24" stroke-width="4"/>

    <!-- Inner Cream Poster Field -->
    <rect x="160" y="120" width="956" height="390" fill="#FAF6EE" stroke="#181A24" stroke-width="2"/>

    <!-- Decorative Stamp in top right -->
    <rect x="910" y="140" width="180" height="50" fill="#FFA800" stroke="#181A24" stroke-width="2"/>
    <text x="1000" y="172" fill="#181A24" font-size="15" font-weight="900" font-family="'Courier New', monospace" text-anchor="middle">
      [ GITHUB: lilinji ]
    </text>

    <!-- Main Slogan -->
    <text x="638" y="215" fill="#181A24" font-size="44" font-weight="900" font-family="Impact, Arial Black, sans-serif" letter-spacing="2" text-anchor="middle">
      EMPOWER YOUR LEARNING JOURNEY
    </text>
    
    <text x="638" y="275" fill="#FF4765" font-size="38" font-weight="900" font-family="Impact, Arial Black, sans-serif" letter-spacing="3" text-anchor="middle">
      — ONE WORD AT A TIME —
    </text>

    <!-- Chinese Tagline in Pink Ribbon -->
    <rect x="250" y="325" width="776" height="55" fill="#181A24"/>
    <text x="638" y="361" fill="#FFA800" font-size="24" font-weight="900" text-anchor="middle">
      让每一个认真背单词的人，都不被残缺的资料辜负。
    </text>

    <text x="638" y="430" fill="#475569" font-size="18" text-anchor="middle">
      涵盖 960+ 权威词书 · 国际标准音标 (IPA) · 108 篇新概念讲义 · 欧路/Anki/Quizlet 完美兼容
    </text>

    <!-- Stamp Serial -->
    <text x="638" y="475" fill="#006B7B" font-size="15" font-family="'Courier New', monospace" font-weight="700" letter-spacing="2" text-anchor="middle">
      ARCHIVE SERIAL NO: #2026-ENG-VAULT-960-RELEASE · CC BY-NC-SA 4.0
    </text>
  </g>

  <!-- Bottom CTA Cards Zone -->
  <g id="bottom-cta-zone" data-pptx-bounds="100 555 1080 130">
    <!-- Star on GitHub -->
    <g id="cta-star">
      <rect x="144" y="564" width="300" height="110" fill="#FFA800"/>
      <rect x="140" y="560" width="300" height="110" fill="#FFFFFF" stroke="#181A24" stroke-width="3"/>
      <text x="290" y="605" fill="#FF4765" font-size="28" font-weight="900" font-family="Impact, sans-serif" text-anchor="middle">
        ⭐ STAR REPOSITORY
      </text>
      <text x="290" y="640" fill="#181A24" font-size="16" font-weight="700" text-anchor="middle">
        点亮 Star 支持开源作者
      </text>
    </g>

    <!-- Free Open Source -->
    <g id="cta-open">
      <rect x="494" y="564" width="300" height="110" fill="#006B7B"/>
      <rect x="490" y="560" width="300" height="110" fill="#FFFFFF" stroke="#181A24" stroke-width="3"/>
      <text x="640" y="605" fill="#006B7B" font-size="28" font-weight="900" font-family="Impact, sans-serif" text-anchor="middle">
        100% OPEN SOURCE
      </text>
      <text x="640" y="640" fill="#181A24" font-size="16" font-weight="700" text-anchor="middle">
        无收费套路 · 社区终身共享
      </text>
    </g>

    <!-- Community & Authors -->
    <g id="cta-author">
      <rect x="844" y="564" width="296" height="110" fill="#181A24"/>
      <rect x="840" y="560" width="296" height="110" fill="#FFFFFF" stroke="#181A24" stroke-width="3"/>
      <text x="988" y="605" fill="#181A24" font-size="22" font-weight="900" text-anchor="middle">
        Made with ❤️ by Ringi
      </text>
      <text x="988" y="640" fill="#64748B" font-size="15" text-anchor="middle">
        &amp; Global Community Contributors
      </text>
    </g>
  </g>
</svg>
