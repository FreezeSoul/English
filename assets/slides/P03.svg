      </text>
      <line x1="950" y1="390" x2="1196" y2="390" stroke="#181A24" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="1073" y="425" fill="#64748B" font-size="14" text-anchor="middle">
        知识共享 CC BY-NC-SA 4.0
      </text>
      <text x="1073" y="450" fill="#64748B" font-size="14" text-anchor="middle">
        无套路 · 无引流 · 零商业化
      </text>
    </g>
  </g>

  <!-- Bottom Feature Strip Zone -->
  <g id="bottom-features-zone" data-pptx-bounds="60 520 1160 155">
    <rect x="60" y="525" width="1156" height="145" fill="#FFF4D9" stroke="#181A24" stroke-width="3"/>
    
    <!-- Feature 1 -->
    <g id="feat-1">
      <rect x="90" y="550" width="130" height="32" fill="#FF4765"/>
      <text x="155" y="572" fill="#FAF6EE" font-size="15" font-weight="900" text-anchor="middle">
        🔄 乱序/正序双轨
      </text>
      <text x="235" y="572" fill="#181A24" font-size="16" font-weight="700">
        考研、四六级、雅思等核心备考库标配正序与乱序版，彻底破除首字母位置联想惯性。
      </text>
    </g>

    <!-- Feature 2 -->
    <g id="feat-2">
      <rect x="90" y="605" width="130" height="32" fill="#006B7B"/>
      <text x="155" y="627" fill="#FAF6EE" font-size="15" font-weight="900" text-anchor="middle">
        🛠️ 格式极简通用
      </text>
      <text x="235" y="627" fill="#181A24" font-size="16" font-weight="700">
        所有词书均提供纯净 .xlsx 与 .txt 格式，1 秒无缝直导 Anki、Quizlet、欧路生词本。
      </text>
    </g>
  </g>
</svg>
