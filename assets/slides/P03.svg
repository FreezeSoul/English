<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     lang="zh-CN" font-family="'PingFang SC', 'Microsoft YaHei', 'Heiti SC', sans-serif"
     data-pptx-page-role="content">
  
  <defs>
    <!-- Riso Halftone Grid -->
    <pattern id="halftone-pink" width="12" height="12" patternUnits="userSpaceOnUse" data-pptx-pattern="dotGrid" data-pptx-fg="#FF4765" data-pptx-bg="#FAF6EE">
      <circle cx="6" cy="6" r="2.2" fill="#FF4765" fill-opacity="0.3"/>
    </pattern>
    <pattern id="halftone-teal" width="12" height="12" patternUnits="userSpaceOnUse" data-pptx-pattern="dotGrid" data-pptx-fg="#006B7B" data-pptx-bg="#FAF6EE">
      <circle cx="6" cy="6" r="2.2" fill="#006B7B" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FAF6EE"/>

  <!-- Top Header Zone -->
  <g id="header-zone" data-pptx-bounds="40 25 1200 130">
    <rect x="60" y="30" width="280" height="30" fill="#006B7B"/>
    <text x="200" y="51" fill="#FAF6EE" font-size="13" font-weight="900" letter-spacing="2" text-anchor="middle" font-family="'Courier New', monospace">
      CHAPTER 02 / HARD DATA
    </text>
    <text x="60" y="105" fill="#181A24" font-size="38" font-weight="900">
      硬核数据大字报：不可替代的体量与纵深
    </text>
    <text x="60" y="138" fill="#FF4765" font-size="18" font-weight="700">
      覆盖 19+ 核心专项分类，构建起由数十万级规范词条组成的知识矩阵
    </text>
  </g>

  <!-- 4 Big Riso Stats Tiles Zone -->
  <g id="stats-grid-zone" data-pptx-bounds="60 165 1160 345">
    <!-- Stat 1: 960+ Books -->
    <g id="stat-tile-1">
      <rect x="64" y="174" width="266" height="330" fill="#FF4765"/>
      <rect x="60" y="170" width="266" height="330" fill="#FFFFFF" stroke="#181A24" stroke-width="3"/>
      <rect x="80" y="190" width="140" height="30" fill="#FFA800" stroke="#181A24" stroke-width="1.5"/>
      <text x="150" y="211" fill="#181A24" font-size="13" font-weight="900" text-anchor="middle">
        TOTAL BOOKS
      </text>
      <text x="193" y="315" fill="#006B7B" font-size="82" font-weight="900" font-family="Impact, Arial Black, sans-serif" text-anchor="middle">
        960+
      </text>
      <text x="193" y="365" fill="#181A24" font-size="22" font-weight="900" text-anchor="middle">
        本 权 威 词 书
      </text>
      <line x1="80" y1="390" x2="306" y2="390" stroke="#006B7B" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="193" y="425" fill="#64748B" font-size="14" text-anchor="middle">
        涵盖 19 大主流体系分类
      </text>
      <text x="193" y="450" fill="#64748B" font-size="14" text-anchor="middle">
        从中小学到学术专业全覆盖
      </text>
    </g>

    <!-- Stat 2: 1,000,000+ Words -->
    <g id="stat-tile-2">
      <rect x="354" y="174" width="266" height="330" fill="#006B7B"/>
      <rect x="350" y="170" width="266" height="330" fill="#FFFFFF" stroke="#181A24" stroke-width="3"/>
      <rect x="370" y="190" width="140" height="30" fill="#FF4765" stroke="#181A24" stroke-width="1.5"/>
      <text x="440" y="211" fill="#FAF6EE" font-size="13" font-weight="900" text-anchor="middle">
        TOTAL ENTRIES
      </text>
      <text x="483" y="315" fill="#FF4765" font-size="70" font-weight="900" font-family="Impact, Arial Black, sans-serif" text-anchor="middle">
        100W+
      </text>
      <text x="483" y="365" fill="#181A24" font-size="22" font-weight="900" text-anchor="middle">
        规 范 标 准 词 条
      </text>
      <line x1="370" y1="390" x2="596" y2="390" stroke="#FF4765" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="483" y="425" fill="#64748B" font-size="14" text-anchor="middle">
        全量国际音标 (IPA)
      </text>
      <text x="483" y="450" fill="#64748B" font-size="14" text-anchor="middle">
        权威词性与精确中文释义
      </text>
    </g>

    <!-- Stat 3: 108 Master Lectures -->
    <g id="stat-tile-3">
      <rect x="644" y="174" width="266" height="330" fill="#FFA800"/>
      <rect x="640" y="170" width="266" height="330" fill="#FFFFFF" stroke="#181A24" stroke-width="3"/>
      <rect x="660" y="190" width="140" height="30" fill="#006B7B" stroke="#181A24" stroke-width="1.5"/>
      <text x="730" y="211" fill="#FAF6EE" font-size="13" font-weight="900" text-anchor="middle">
        EXCLUSIVE ASSET
      </text>
      <text x="773" y="315" fill="#FFA800" font-size="82" font-weight="900" font-family="Impact, Arial Black, sans-serif" text-anchor="middle">
        108 篇
      </text>
      <text x="773" y="365" fill="#181A24" font-size="22" font-weight="900" text-anchor="middle">
        新概念名师精析
      </text>
      <line x1="660" y1="390" x2="886" y2="390" stroke="#FFA800" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="773" y="425" fill="#64748B" font-size="14" text-anchor="middle">
        第三、四册课文逐篇解析
      </text>
      <text x="773" y="450" fill="#64748B" font-size="14" text-anchor="middle">
        附 47.4 MB 完整合订版 PDF
      </text>
    </g>

    <!-- Stat 4: 0 RMB Free -->
    <g id="stat-tile-4">
      <rect x="934" y="174" width="286" height="330" fill="#181A24"/>
      <rect x="930" y="170" width="286" height="330" fill="#FFFFFF" stroke="#181A24" stroke-width="3"/>
      <rect x="950" y="190" width="140" height="30" fill="#181A24" stroke="#181A24" stroke-width="1.5"/>
      <text x="1020" y="211" fill="#FFA800" font-size="13" font-weight="900" text-anchor="middle">
