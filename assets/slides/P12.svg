<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     lang="zh-CN" font-family="'PingFang SC', 'Microsoft YaHei', 'Heiti SC', Impact, sans-serif">
  <rect width="1280" height="720" fill="#FAF6EE"/>

  <!-- Top Tape -->
  <g id="top-tape">
    <rect x="44" y="24" width="1192" height="42" fill="#006B7B"/>
    <rect x="40" y="20" width="1192" height="42" fill="#181A24"/>
    <text x="636" y="47" fill="#FFA800" font-size="14" font-weight="900" letter-spacing="3" text-anchor="middle" font-family="'Courier New', monospace">
      ★ OPEN SOURCE COLLABORATION · EMPOWER GLOBAL LEARNERS · STAR &amp; FORK ★
    </text>
  </g>

  <!-- Center Card -->
  <g id="center-card">
    <rect x="104" y="99" width="1072" height="430" fill="#006B7B"/>
    <rect x="100" y="95" width="1072" height="430" fill="#FF4765" stroke="#181A24" stroke-width="4"/>
    <rect x="120" y="115" width="1032" height="390" fill="#FAF6EE" stroke="#181A24" stroke-width="2"/>

    <!-- Stamp -->
    <rect x="910" y="135" width="210" height="46" fill="#FFA800" stroke="#181A24" stroke-width="2"/>
    <text x="1015" y="164" fill="#181A24" font-size="15" font-weight="900" font-family="'Courier New', monospace" text-anchor="middle">
      [ GITHUB STAR ]
    </text>

    <!-- Content -->
    <text x="636" y="200" fill="#181A24" font-size="64" font-weight="900" text-anchor="middle">⭐</text>
    <text x="636" y="265" fill="#181A24" font-size="44" font-weight="900" font-family="Impact, Arial Black, sans-serif" letter-spacing="2" text-anchor="middle">
      STAR ON GITHUB
    </text>
    <text x="636" y="315" fill="#FF4765" font-size="26" font-weight="900" text-anchor="middle">
      github.com/lilinji/English
    </text>

    <rect x="240" y="345" width="792" height="50" fill="#E1F2F5" stroke="#181A24" stroke-width="2"/>
    <text x="636" y="377" fill="#181A24" font-size="17" font-weight="700" text-anchor="middle">
      涵盖 960+ 词书 · 108 篇讲义 · 100% 永久开源免费 · 欢迎提交 PR 参与词库建设
    </text>

    <rect x="360" y="420" width="552" height="55" fill="#FFA800" stroke="#181A24" stroke-width="3"/>
    <text x="636" y="456" fill="#181A24" font-size="20" font-weight="900" letter-spacing="2" text-anchor="middle">
      ★ 点亮右上角 Star 支持开源作者 Ringi
    </text>
  </g>

  <!-- Bottom Badges -->
  <g id="bottom-badges">
    <rect x="100" y="560" width="340" height="110" fill="#FAF6EE" stroke="#FFA800" stroke-width="3"/>
    <text x="270" y="605" fill="#181A24" font-size="24" font-weight="900" text-anchor="middle">Fork 仓库</text>
    <text x="270" y="640" fill="#64748B" font-size="15" text-anchor="middle">自由定制专属于你的生词库</text>

    <rect x="470" y="560" width="340" height="110" fill="#FAF6EE" stroke="#006B7B" stroke-width="3"/>
    <text x="640" y="605" fill="#006B7B" font-size="24" font-weight="900" text-anchor="middle">提交勘误 PR</text>
    <text x="640" y="640" fill="#64748B" font-size="15" text-anchor="middle">审核后即刻计入全球贡献者</text>

    <rect x="840" y="560" width="332" height="110" fill="#FAF6EE" stroke="#FF4765" stroke-width="3"/>
    <text x="1006" y="605" fill="#FF4765" font-size="24" font-weight="900" text-anchor="middle">CC BY-NC-SA 4.0</text>
    <text x="1006" y="640" fill="#64748B" font-size="15" text-anchor="middle">永久开源 · 抵制商业套路</text>
  </g>
</svg>
