<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"
     lang="zh-CN" font-family="'PingFang SC', 'Microsoft YaHei', 'Heiti SC', Impact, sans-serif"
     data-pptx-page-role="cover">
  
  <defs>
    <!-- Riso Halftone Grid -->
    <pattern id="halftone-pink" width="12" height="12" patternUnits="userSpaceOnUse" data-pptx-pattern="dotGrid" data-pptx-fg="#FF4765" data-pptx-bg="#FAF6EE">
      <circle cx="6" cy="6" r="2.2" fill="#FF4765" fill-opacity="0.3"/>
    </pattern>
    <pattern id="halftone-teal" width="12" height="12" patternUnits="userSpaceOnUse" data-pptx-pattern="dotGrid" data-pptx-fg="#006B7B" data-pptx-bg="#FAF6EE">
      <circle cx="6" cy="6" r="2.2" fill="#006B7B" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background Paper -->
  <rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FAF6EE"/>

  <!-- Top DIY Tape Banner Zone -->
  <g id="top-banner-zone" data-pptx-bounds="40 18 1200 55">
    <rect x="44" y="24" width="1196" height="42" fill="#FF4765" fill-opacity="0.85"/>
    <rect x="40" y="20" width="1196" height="42" fill="#181A24"/>
    <text x="638" y="47" fill="#FFA800" font-size="14" font-weight="900" letter-spacing="3" text-anchor="middle" font-family="'Courier New', Menlo, monospace">
      ★ SPECIAL ARCHIVE EDITION · ISSUED FOR GLOBAL LEARNERS · OPEN REPOSITORY ★
    </text>
  </g>

  <!-- Main Hero Content Zone (Holding Left Number Box and Right Title Box) -->
  <g id="main-hero-zone" data-pptx-bounds="60 85 1160 470">
    <!-- Left Hero Badge - 960+ Giant Box -->
    <g id="hero-number-box">
      <!-- Offset Pink Layer -->
      <rect x="85" y="105" width="310" height="440" fill="#FF4765"/>
      <!-- Foreground Teal Box -->
      <rect x="80" y="100" width="310" height="440" fill="#006B7B" stroke="#181A24" stroke-width="4"/>
      <!-- Perforated Top Edge Accent -->
      <line x1="80" y1="180" x2="390" y2="180" stroke="#FAF6EE" stroke-width="3" stroke-dasharray="8 6"/>

      <text x="235" y="152" fill="#FAF6EE" font-size="20" font-weight="800" letter-spacing="2" text-anchor="middle">
        COLLECTION SCALE
      </text>
      <text x="235" y="310" fill="#FFA800" font-size="108" font-weight="900" font-family="Impact, Arial Black, sans-serif" text-anchor="middle">
        960+
      </text>
      <text x="235" y="360" fill="#FAF6EE" font-size="28" font-weight="900" text-anchor="middle">
        本 权 威 词 书
      </text>
      <!-- Bottom Stamp Badge -->
      <rect x="110" y="400" width="250" height="50" fill="#FAF6EE" stroke="#181A24" stroke-width="2"/>
      <text x="235" y="432" fill="#181A24" font-size="16" font-weight="900" font-family="'Courier New', monospace" text-anchor="middle">
        [ 100% CC BY-NC-SA 4.0 ]
      </text>
      <text x="235" y="500" fill="#FAF6EE" font-size="15" text-anchor="middle">
        涵盖基础教材至考博/学术
      </text>
    </g>

    <!-- Right Hero Headline & Story -->
    <g id="hero-main-title">
      <!-- Small Category Label -->
      <rect x="430" y="100" width="220" height="34" fill="#FFA800" stroke="#181A24" stroke-width="2"/>
      <text x="540" y="123" fill="#181A24" font-size="16" font-weight="900" text-anchor="middle">
        数字化词汇新基建
      </text>

      <!-- Main Title: English Condensed with Pink Drop Shadow -->
      <text x="434" y="194" fill="#FF4765" font-size="44" font-weight="900" font-family="Impact, Arial Black, sans-serif" letter-spacing="1">
        ENGLISH VOCABULARY VAULT
      </text>
      <text x="430" y="190" fill="#181A24" font-size="44" font-weight="900" font-family="Impact, Arial Black, sans-serif" letter-spacing="1">
        ENGLISH VOCABULARY VAULT
      </text>

      <!-- Chinese Super Title -->
      <text x="430" y="270" fill="#006B7B" font-size="64" font-weight="900" letter-spacing="2">
        全网最全英语单词词库
      </text>

      <!-- Subtitle Banner in Yellow Poster Box -->
      <rect x="434" y="314" width="766" height="56" fill="#181A24"/>
      <rect x="430" y="310" width="766" height="56" fill="#FFA800" stroke="#181A24" stroke-width="3"/>
      <text x="450" y="346" fill="#181A24" font-size="22" font-weight="900">
        国际标准音标 (IPA) · 权威释义 · Anki / Quizlet / 欧路词典完美兼容
      </text>

      <!-- Paragraph Description in Riso Frame with Combined tspan -->
      <rect x="430" y="395" width="766" height="135" fill="#FFFFFF" stroke="#181A24" stroke-width="3"/>
      <rect x="436" y="401" width="12" height="123" fill="#FF4765"/>
      <text x="470" y="435" fill="#181A24" font-size="18" font-weight="700">
        ⚡ 彻底终结词汇资源碎片化现状：
      </text>
      <text x="470" y="470" fill="#475569" font-size="16">
        从小学教材到考博学术，从雅思托福到程序员专业英语；正序/乱序双版本打破记忆惯性，
        <tspan x="470" dy="32">更深度附赠新概念英语 108 篇名师讲义合订本与课文精析，开箱即用，永久开源。</tspan>
      </text>
    </g>
  </g>

  <!-- Bottom Badges Strip Zone -->
  <g id="bottom-stamps-zone" data-pptx-bounds="60 565 1160 120">
    <!-- Stamp 1 -->
    <g id="stamp-box-1">
      <rect x="80" y="575" width="260" height="95" fill="#FAF6EE" stroke="#006B7B" stroke-width="3"/>
      <rect x="88" y="583" width="244" height="79" fill="none" stroke="#006B7B" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="210" y="618" fill="#006B7B" font-size="20" font-weight="900" text-anchor="middle">
        960+ 本 权 威 词 书
      </text>
      <text x="210" y="648" fill="#181A24" font-size="14" font-family="'Courier New', monospace" text-anchor="middle">
        19+ 完整分类大纲
      </text>
    </g>

    <!-- Stamp 2 -->
    <g id="stamp-box-2">
      <rect x="365" y="575" width="260" height="95" fill="#FAF6EE" stroke="#FF4765" stroke-width="3"/>
      <rect x="373" y="583" width="244" height="79" fill="none" stroke="#FF4765" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="495" y="618" fill="#FF4765" font-size="20" font-weight="900" text-anchor="middle">
        IPA 国际标准音标
      </text>
      <text x="495" y="648" fill="#181A24" font-size="14" font-family="'Courier New', monospace" text-anchor="middle">
        杜绝乱码 · 权威规范
      </text>
    </g>

    <!-- Stamp 3 -->
    <g id="stamp-box-3">
      <rect x="650" y="575" width="260" height="95" fill="#FAF6EE" stroke="#181A24" stroke-width="3"/>
      <rect x="658" y="583" width="244" height="79" fill="none" stroke="#181A24" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="780" y="618" fill="#181A24" font-size="20" font-weight="900" text-anchor="middle">
        ANKI / QUIZLET
      </text>
      <text x="780" y="648" fill="#006B7B" font-size="14" font-family="'Courier New', monospace" text-anchor="middle">
        科学艾宾浩斯间隔记忆
      </text>
    </g>

    <!-- Stamp 4 -->
    <g id="stamp-box-4">
      <rect x="935" y="575" width="260" height="95" fill="#FAF6EE" stroke="#FFA800" stroke-width="3"/>
      <rect x="943" y="583" width="244" height="79" fill="none" stroke="#FFA800" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="1065" y="618" fill="#181A24" font-size="20" font-weight="900" text-anchor="middle">
        100% 永久开源免费
      </text>
      <text x="1065" y="648" fill="#FF4765" font-size="14" font-family="'Courier New', monospace" text-anchor="middle">
        GitHub @lilinji/English
      </text>
    </g>
  </g>
</svg>
